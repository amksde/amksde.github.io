{{ define "main" }}
<article>
    <h2>{{ print "> " .Title }}</h2>
    {{ if or .Lastmod .Date }}
    <div class="article-meta">
        {{ if .Lastmod }}
            <span class="date">Updated: {{ .Lastmod.Format "2006-01-02" }}</span>
            <span> | </span>
        {{ end }}
        {{ if .Date }}
            <span class="date">Created: {{ .Date.Format "2006-01-02" }}</span>
        {{ end }}
    </div>
    {{ end }}
    {{ .Content }}
</article>
{{ end }}
